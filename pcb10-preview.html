<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>pcb10 preview</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  #app { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  header { padding: 6px 12px; background: #eee; border-bottom: 1px solid #ccc; font-size: 13px; display: flex; align-items: center; gap: 10px; }
  header a { color: #06c; cursor: pointer; text-decoration: none; }
  header a:hover { text-decoration: underline; }
  header .spacer { flex: 1; }
  header input.title { font-size: 13px; padding: 3px 6px; border: 1px solid #ccc; border-radius: 3px; width: 260px; }
  header button { font-size: 13px; padding: 3px 10px; }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #preview { flex: 1 1 0; overflow: auto; background: #333; border-bottom: 1px solid #ccc; min-height: 0; text-align: center; padding: 10px; box-sizing: border-box; }
  #preview canvas { display: inline-block; image-rendering: pixelated; }
  #modes { display: inline-flex; gap: 4px; }
  #modes button { font-size: 12px; padding: 2px 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  #modes button.active { background: #444; color: #fff; border-color: #444; }
  #renderers { display: inline-flex; gap: 4px; margin-left: 8px; }
  #renderers button { font-size: 12px; padding: 2px 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  #renderers button.active { background: #444; color: #fff; border-color: #444; }
  .pane-label .spacer { flex: 1; }
  /* Editor text sized to match the comictest editor: 20px / 1.4. */
  #src { flex: 1 1 0; min-height: 0; width: 100%; box-sizing: border-box; border: 0; padding: 10px;
         font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 20px; line-height: 1.4;
         -webkit-text-size-adjust: 100%; resize: none; outline: none; }
  .pane-label { padding: 4px 10px; font-size: 12px; background: #f6f6f6; border-bottom: 1px solid #ddd; color: #555; display: flex; gap: 12px; }
  .pane-label .err { color: #c00; }

  #index { padding: 20px 24px; overflow: auto; }
  #index h1 { font-size: 18px; margin: 0 0 12px 0; }
  #index ul { list-style: none; padding: 0; margin: 0 0 16px 0; }
  #index li { padding: 6px 8px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
  #index li a { color: #06c; text-decoration: none; flex: 1; cursor: pointer; }
  #index li a:hover { text-decoration: underline; }
  #index li .meta { color: #888; font-size: 12px; }
  #index li button { font-size: 12px; }
  #index .empty { color: #888; font-style: italic; }
  #index button.new { font-size: 14px; padding: 6px 14px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* =====================================================================
 * pcb10 preview — 2-layer PCB artwork draft in the browser.
 * Coordinate system: mm, x right, y up.
 * =================================================================== */

const WIDTHS = { "2": 0.2, "3": 0.3, "6": 0.6 };
const INITIAL_GRID = 1;
const MAX_CALL_DEPTH = 32;
const DIRS = {
  "1": [-1, -1], "2": [ 0, -1], "3": [ 1, -1],
  "4": [-1,  0],                "6": [ 1,  0],
  "7": [-1,  1], "8": [ 0,  1], "9": [ 1,  1],
};
const LAYERS = new Set(["P","p","Q","q","R","r","S","s","B","T","O","o"]);
const MIRROR_LAYER = { P:"p", p:"P", Q:"q", q:"Q", R:"r", r:"R", S:"s", s:"S", B:"B", T:"T", O:"B", o:"o" };
const SVG_NS = "http://www.w3.org/2000/svg";

const LAYER_COLORS = {
  P: "#e33", p: "#39f",
  R: "rgba(255,200,80,0.55)", r: "rgba(100,220,255,0.55)",
  S: "#fff",  s: "#bbb",
  B: "#0f0",  T: "#000",
};
const LAYER_ORDER = ["R","r","B","P","p","S","s","T"];

/* ---------- interpreter ---------- */

function makeCtx() {
  return {
    x: 0, y: 0, layer: "p", width: 0.3, grid: INITIAL_GRID,
    stack: [],
    vars: {},               // shared (global)
    pinScopes: [],          // shared, but push/pop are localized
    currentDef: null,       // set during definition dry-pass
    components: {},         // shared
    labeledCalls: {},       // shared
    primitives: [],         // shared
    bbox: { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity },
    emit: true,
    transform: null,        // {flip, angle, offsetX, offsetY} — set when rendering a component body
    env: null,              // component namespace visible at definition time
    depth: 0,               // call nesting depth
    errors: [],
  };
}

function applyRotFlip(t, x, y) {
  let px = x, py = y;
  if (t.flip) px = -px;
  const a = ((t.angle % 360) + 360) % 360;
  const dir = t.flip ? -1 : 1;  // >: CW, <: CCW
  const eff = ((a * dir) % 360 + 360) % 360;
  switch (eff) {
    case 0:   return { x: px,  y: py  };
    case 90:  return { x: py,  y: -px };
    case 180: return { x: -px, y: -py };
    case 270: return { x: -py, y: px  };
  }
  return { x: px, y: py };
}

function composeTransform(outer, inner) {
  // Returns the transform equivalent to applying `inner` then `outer`.
  // Needed so a component called from inside another component body
  // inherits the outer placement (offset, rotation and mirror).
  if (!outer) return inner;
  const so = outer.flip ? -1 : 1;
  const eo = ((outer.angle * so) % 360 + 360) % 360;
  const si = inner.flip ? -1 : 1;
  const ei = ((inner.angle * si) % 360 + 360) % 360;
  const flip = outer.flip !== inner.flip;
  const ec = ((eo + ei * so) % 360 + 360) % 360;
  const sc = flip ? -1 : 1;
  const angle = ((ec * sc) % 360 + 360) % 360;
  const r = applyRotFlip({ flip: outer.flip, angle: outer.angle, offsetX: 0, offsetY: 0 }, inner.offsetX, inner.offsetY);
  return { flip, angle, offsetX: r.x + outer.offsetX, offsetY: r.y + outer.offsetY };
}

function transformPt(ctx, x, y) {
  if (!ctx.transform) return { x, y };
  const r = applyRotFlip(ctx.transform, x, y);
  return { x: r.x + ctx.transform.offsetX, y: r.y + ctx.transform.offsetY };
}
function transformLayer(ctx, layer) {
  return (ctx.transform && ctx.transform.flip) ? MIRROR_LAYER[layer] : layer;
}
function updateBBox(ctx, x, y) {
  const b = ctx.bbox;
  if (x < b.minX) b.minX = x;
  if (y < b.minY) b.minY = y;
  if (x > b.maxX) b.maxX = x;
  if (y > b.maxY) b.maxY = y;
}
function emitPrim(ctx, prim) {
  if (prim.layer === "Q") {
    ctx.primitives.push({ ...prim, layer: "P" });
    ctx.primitives.push({ ...prim, layer: "R" });
  } else if (prim.layer === "q") {
    ctx.primitives.push({ ...prim, layer: "p" });
    ctx.primitives.push({ ...prim, layer: "r" });
  } else {
    ctx.primitives.push(prim);
  }
}
function drawLine(ctx, x1, y1, x2, y2) {
  if (!ctx.emit) return;
  if (ctx.layer === "o") return;
  const p1 = transformPt(ctx, x1, y1);
  const p2 = transformPt(ctx, x2, y2);
  const layer = transformLayer(ctx, ctx.layer);
  emitPrim(ctx, { type:"line", x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, width:ctx.width, layer });
  const r = ctx.width / 2;
  updateBBox(ctx, Math.min(p1.x,p2.x)-r, Math.min(p1.y,p2.y)-r);
  updateBBox(ctx, Math.max(p1.x,p2.x)+r, Math.max(p1.y,p2.y)+r);
}
function drawCircle(ctx, cx, cy, r, layerLetter) {
  if (!ctx.emit) return;
  if (layerLetter === "o") return;
  const p = transformPt(ctx, cx, cy);
  const layer = transformLayer(ctx, layerLetter);
  emitPrim(ctx, { type:"circle", cx:p.x, cy:p.y, r, layer });
  updateBBox(ctx, p.x - r, p.y - r);
  updateBBox(ctx, p.x + r, p.y + r);
}
function drawRect(ctx, x1, y1, x2, y2, layerLetter) {
  if (!ctx.emit) return;
  if (layerLetter === "o") return;
  const p1 = transformPt(ctx, x1, y1);
  const p2 = transformPt(ctx, x2, y2);
  const layer = transformLayer(ctx, layerLetter);
  const x = Math.min(p1.x, p2.x), y = Math.min(p1.y, p2.y);
  const w = Math.abs(p2.x - p1.x), h = Math.abs(p2.y - p1.y);
  emitPrim(ctx, { type:"rect", x, y, w, h, layer });
  updateBBox(ctx, x, y);
  updateBBox(ctx, x + w, y + h);
}

function findMatchingBrace(s, start) {
  // s[start] === '{' — return index of matching '}'
  let depth = 1;
  let i = start + 1;
  while (i < s.length) {
    const c = s[i];
    if (c === "#") { while (i < s.length && s[i] !== "\n") i++; continue; }
    if (c === "{") depth++;
    else if (c === "}") { depth--; if (depth === 0) return i; }
    i++;
  }
  return s.length;  // unmatched — treat EOF as close
}

function parseMove(source, i) {
  // x-part
  let m = /^([-+])([.0-9]+)/.exec(source.slice(i));
  let xKind, xVal, len;
  if (m) { len = m[0].length; xKind = "rel"; xVal = (m[1] === "-" ? -1 : 1) * parseFloat(m[2]); }
  else {
    m = /^-([A-Za-z])/.exec(source.slice(i));
    if (!m) return null;
    len = m[0].length; xKind = "var"; xVal = m[1];
  }
  const rest = source.slice(i + len);
  // y-part
  m = /^([-+])([.0-9]+)/.exec(rest);
  let yKind, yVal, ylen;
  if (m) { ylen = m[0].length; yKind = "rel"; yVal = (m[1] === "-" ? -1 : 1) * parseFloat(m[2]); }
  else {
    m = /^([A-Za-z])/.exec(rest);
    if (!m) return null;
    ylen = m[0].length; yKind = "var"; yVal = m[1];
  }
  return { x:{kind:xKind, val:xVal}, y:{kind:yKind, val:yVal}, end: i + len + ylen };
}

function applyMove(ctx, xp, yp, moveOnly) {
  const x0 = ctx.x, y0 = ctx.y;
  let nx, ny;
  if (xp.kind === "rel") nx = x0 + xp.val * ctx.grid;
  else { const v = ctx.vars[xp.val] || { x:0, y:0 }; nx = v.x; }
  if (yp.kind === "rel") ny = y0 + yp.val * ctx.grid;
  else { const v = ctx.vars[yp.val] || { x:0, y:0 }; ny = v.y; }
  if (!moveOnly) drawLine(ctx, x0, y0, nx, ny);
  ctx.x = nx; ctx.y = ny;
}

function resolvePinAt(ctx, scope, name) {
  const local = scope.pins[name];
  if (!local) return null;
  const t = scope.transform;
  const r = applyRotFlip(t, local.x, local.y);
  return { x: r.x + t.offsetX, y: r.y + t.offsetY };
}

function addError(ctx, msg) {
  // The definition dry pass runs with emit=false and may legitimately hit
  // forward references; only report from the real (emitting) pass.
  if (ctx.emit) ctx.errors.push(msg);
}
function moveTo(ctx, nx, ny, moveOnly) {
  if (!moveOnly) drawLine(ctx, ctx.x, ctx.y, nx, ny);
  ctx.x = nx; ctx.y = ny;
}
function registerPin(ctx, name) {
  // Pin names are letters, digits and underscore, and may start with a digit
  // so values like 100k work. '.' is excluded because it separates
  // label from pin in @label.pin.
  if (!/^[A-Za-z0-9_]+$/.test(name)) {
    addError(ctx, "@=" + name + ": not a valid pin name");
    return;
  }
  if (ctx.currentDef) ctx.currentDef.pins[name] = { x: ctx.x, y: ctx.y };
  else addError(ctx, "@=" + name + ": not inside a component definition");
}

function handleAt(ctx, source, i, moveOnly) {
  // Returns the next source index, or -1 when this is not an @ command.
  //   @=pin        register pin on the enclosing component definition
  //   @pin         inside a call block: line to that pin of the called component
  //   @label.pin   line to a pin of a labelled call
  //   !@pin / !@label.pin   same, move only
  //   @=>{a b}     register pins a and b here, and draw "a b" as silk
  const dec = /^@=(>+|<+)\{/.exec(source.slice(i));
  if (dec) {
    const chev = dec[1];
    const braceStart = i + dec[0].length - 1;
    const close = source.indexOf("}", braceStart + 1);
    const end = close < 0 ? source.length : close;
    const text = source.slice(braceStart + 1, end);
    // Every whitespace-separated word becomes a pin at the current point,
    // then the whole string is drawn, so @=>{a b} is @=a @=b >{a b}.
    for (const name of text.split(/\s+/)) {
      if (!name) continue;
      registerPin(ctx, name);
    }
    drawText(ctx, text, chev[0] === "<", ((chev.length - 1) * 90) % 360);
    return close < 0 ? source.length : close + 1;
  }
  // Match dots too, so @=0.1u is reported as an unusable name rather than
  // quietly registering the pin "0" and running the rest as commands.
  const reg = /^@=([A-Za-z0-9_.]+)/.exec(source.slice(i));
  if (reg) {
    registerPin(ctx, reg[1]);
    return i + reg[0].length;
  }
  const m = /^@([A-Za-z0-9_]+)(?:\.([A-Za-z0-9_]+))?/.exec(source.slice(i));
  if (!m) return -1;
  const full = m[0], first = m[1], second = m[2];
  let target = null;
  if (second) {
    const call = ctx.labeledCalls[first];
    if (!call) addError(ctx, "unknown label: " + first);
    else {
      target = resolvePinAt(ctx, call, second);
      if (!target) addError(ctx, "unknown pin: " + first + "." + second);
    }
  } else if (ctx.pinScopes.length) {
    const scope = ctx.pinScopes[ctx.pinScopes.length - 1];
    target = resolvePinAt(ctx, scope, first);
    if (!target) addError(ctx, "unknown pin: " + first);
  } else {
    addError(ctx, "@" + first + ": no component call scope (use @=" + first + " to define a pin)");
  }
  if (target) moveTo(ctx, target.x, target.y, moveOnly);
  return i + full.length;
}

/* ---------- stroke font (built-in, ASCII 0x20-0x7E) ---------- */
// Glyphs live on a 4-wide grid: baseline y=0, x-height y=4, cap height y=6,
// descender y=-2. Encoded as comma-separated polylines, each point a pair of
// digits "xy" with y biased by +2 so the range -2..7 stays one digit.
const FONT = {
  " ":"","!":"2824,2322","\"":"1816,3836","#":"1812,3832,0646,0444","$":"473818070615354443321203,2921",
  "%":"0608282606,2224444222,0248","&":"42151728373603123243","'":"2826","(":"38161432",")":"18363412",
  "*":"2723,0644,4604","+":"2723,0545",",":"232211","-":"0545",".":"2322","/":"0248",
  "0":"123243473818070312,0347","1":"062822,0242","2":"07183847460242","3":"084825354443321203",
  "4":"32380444","5":"480805354443321203","6":"473818070312324344351504","7":"084812",
  "8":"15060718384746351504031232434435","9":"031232434738180706153546",":":"2625,2322",";":"2625,232211",
  "<":"470543","=":"0646,0444",">":"074503","?":"07183847462524,2322","@":"3626243437474332120307183847",
  "A":"022842,1434","B":"02083847463505,3544433202","C":"4738180703123243","D":"02083847433202",
  "E":"48080242,0535","F":"480802,0535","G":"47381807031232434525","H":"0802,4842,0545","I":"1838,2822,1232",
  "J":"3833221203","K":"0802,4804,1542","L":"080242","M":"0208254842","N":"02084248","O":"123243473818070312",
  "P":"02083847463505","Q":"123243473818070312,2442","R":"02083847463505,2542","S":"473818070615354443321203",
  "T":"0848,2822","U":"080312324348","V":"082248","W":"0812253248","X":"0842,0248","Y":"082548,2522",
  "Z":"08480242","[":"38181232","\\":"0842","]":"18383212","^":"062846","_":"0141","`":"1836",
  "a":"4642,4536160503123243","b":"0802,0312324345361605","c":"4536160503123243","d":"4842,4332120305163645",
  "e":"04444536160503123243","f":"48382722,1636","g":"4641301001,4332120305163645","h":"0802,0516364542",
  "i":"2827,2622","j":"3837,3631201001","k":"0802,3603,1432","l":"182822","m":"0602,05162522,25364542",
  "n":"0602,0516364542","o":"123243453616050312","p":"0600,0312324345361605","q":"4640,4332120305163645",
  "r":"0602,05163645","s":"45361605143443321203","t":"28233243,1636","u":"060312324346,4342","v":"062246",
  "w":"0612243246","x":"0642,0246","y":"0603123243,4641301001","z":"06460242","{":"483827261524233242",
  "|":"2921","}":"081827263524231202","~":"05163445",
};
const FONT_CAP = 6;        // cap height, in glyph units
const FONT_WIDTH = 4;      // glyph cell width, in glyph units
const FONT_ADVANCE = 6;    // per-character advance, in glyph units

function glyphStrokes(ch) {
  const enc = FONT[ch];
  if (enc === undefined) return null;
  const out = [];
  for (const poly of enc.split(",")) {
    const pts = [];
    for (let k = 0; k + 1 < poly.length; k += 2) pts.push([+poly[k], +poly[k + 1] - 2]);
    if (pts.length > 1) out.push(pts);
  }
  return out;
}

function drawText(ctx, raw, flip, angle) {
  // A trailing space is an alignment marker rather than text, and a leading
  // space joins it to mean "centred":
  //   >{abc}    the text starts at the pen (default)
  //   >{abc }   the text ends at the pen
  //   >{ abc }  the text is centred on the pen
  // Exactly one space is consumed at each end, so >{abc  } draws "abc "
  // ending at the pen. A leading space with no trailing one is ordinary
  // text, so >{ abc} draws " abc" starting at the pen.
  let text = raw, left = false, right = false;
  if (text.endsWith(" ")) {
    right = true;
    if (text.length >= 2 && text.startsWith(" ")) { left = true; text = text.slice(1); }
    text = text.slice(0, -1);
  }
  const chars = Array.from(text);
  // Span runs from the left edge of the first cell to the right edge of the
  // last one, so it excludes the trailing inter-character gap and centring
  // stays symmetric.
  const span = chars.length ? chars.length * FONT_ADVANCE - (FONT_ADVANCE - FONT_WIDTH) : 0;
  const off = right ? (left ? span / 2 : span) : 0;
  // One glyph unit is one current line width, so the cap height is
  // FONT_CAP * width and the text scales with whatever width is in effect.
  const w = ctx.width;
  const t = { flip, angle, offsetX: 0, offsetY: 0 };
  const ox = ctx.x, oy = ctx.y;
  // Shifting the pen start in glyph space keeps the anchor on the pen under
  // any rotation or mirror, since the whole run is transformed afterwards.
  let pen = -off;
  for (const ch of chars) {
    const strokes = glyphStrokes(ch);
    if (strokes) {
      for (const poly of strokes) {
        for (let k = 0; k + 1 < poly.length; k++) {
          const a = applyRotFlip(t, (pen + poly[k][0]) * w, poly[k][1] * w);
          const b = applyRotFlip(t, (pen + poly[k + 1][0]) * w, poly[k + 1][1] * w);
          drawLine(ctx, ox + a.x, oy + a.y, ox + b.x, oy + b.y);
        }
      }
    }
    // Unsupported characters still advance, so columns stay aligned.
    pen += FONT_ADVANCE;
  }
}

function moveOnlyAt(ctx, source, k) {
  // Advance the pen without drawing, over whatever target form starts at k
  // (+0+0 / -aa / a direction digit / @pin). Returns the next source index,
  // or -1 when nothing there is a move. Shared by "!" and the {ab} dogleg.
  const mv = parseMove(source, k);
  if (mv) { applyMove(ctx, mv.x, mv.y, true); return mv.end; }
  const nc = source[k];
  if (nc && /[12346789]/.test(nc)) {
    const [dx, dy] = DIRS[nc];
    ctx.x += dx * ctx.grid;
    ctx.y += dy * ctx.grid;
    return k + 1;
  }
  if (nc === "@") return handleAt(ctx, source, k, true);
  return -1;
}

function solveDogleg(x0, y0, x1, y1, d1, d2) {
  // Find the elbow E with E = start + s*d1 and target = E + t*d2, s,t >= 0.
  // Returns null when the pair cannot reach the target that way (parallel
  // directions, or an elbow that would run backwards) — behaviour there is
  // unspecified, so the caller falls back to a straight line.
  const [ax, ay] = d1, [bx, by] = d2;
  const det = ax * by - ay * bx;
  if (Math.abs(det) < 1e-12) return null;
  const dx = x1 - x0, dy = y1 - y0;
  const s = (dx * by - dy * bx) / det;
  const t = (ax * dy - ay * dx) / det;
  if (s < -1e-9 || t < -1e-9) return null;
  return { x: x0 + s * ax, y: y0 + s * ay };
}

function drawSeg(ctx, x1, y1, x2, y2) {
  if (Math.abs(x2 - x1) < 1e-12 && Math.abs(y2 - y1) < 1e-12) return;
  drawLine(ctx, x1, y1, x2, y2);
}

function handleDogleg(ctx, source, i, d1, d2) {
  // {ab}<target>: draw to <target> as two segments, along d1 then along d2.
  const x0 = ctx.x, y0 = ctx.y;
  const ni = moveOnlyAt(ctx, source, i);
  if (ni < 0) return -1;
  const x1 = ctx.x, y1 = ctx.y;
  if (Math.abs(x1 - x0) < 1e-12 && Math.abs(y1 - y0) < 1e-12) return ni;
  const mid = solveDogleg(x0, y0, x1, y1, d1, d2);
  if (mid) {
    // Either leg is empty when the target already lies on one direction;
    // skip it so a degenerate elbow does not leave a stray round dot.
    drawSeg(ctx, x0, y0, mid.x, mid.y);
    drawSeg(ctx, mid.x, mid.y, x1, y1);
  } else {
    drawLine(ctx, x0, y0, x1, y1);
  }
  return ni;
}

function runSource(ctx, source) {
  let i = 0;
  const n = source.length;
  while (i < n) {
    const c = source[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === "#") { while (i < n && source[i] !== "\n") i++; continue; }
    if (c === "}") { i++; continue; }  // stray close — ignore
    if (c === "(") {
      ctx.stack.push({ x:ctx.x, y:ctx.y, layer:ctx.layer, width:ctx.width, grid:ctx.grid });
      i++; continue;
    }
    if (c === ")") {
      if (ctx.stack.length) {
        const s = ctx.stack.pop();
        ctx.x=s.x; ctx.y=s.y; ctx.layer=s.layer; ctx.width=s.width; ctx.grid=s.grid;
      }
      i++; continue;
    }
    if (c === "/") { ctx.grid /= 2; i++; continue; }
    if (c === "*") { ctx.grid *= 2; i++; continue; }
    if (c === "=") {
      const m = /^=([.0-9]+)/.exec(source.slice(i));
      if (m) { ctx.grid = parseFloat(m[1]); i += m[0].length; continue; }
      i++; continue;
    }
    if (c === "+" && i + 1 < n && /[A-Za-z]/.test(source[i+1])) {
      ctx.vars[source[i+1]] = { x: ctx.x, y: ctx.y };
      i += 2; continue;
    }
    if (c === "+" || c === "-") {
      const mv = parseMove(source, i);
      if (mv) { applyMove(ctx, mv.x, mv.y, false); i = mv.end; continue; }
      i++; continue;
    }
    if (c === "!") {
      const ni = moveOnlyAt(ctx, source, i + 1);
      if (ni >= 0) { i = ni; continue; }
      i++; continue;
    }
    if (c === "{") {
      const dg = /^\{([12346789])([12346789])\}/.exec(source.slice(i));
      if (dg) {
        const ni = handleDogleg(ctx, source, i + dg[0].length, DIRS[dg[1]], DIRS[dg[2]]);
        if (ni >= 0) { i = ni; continue; }
      }
      // A literal {} does nothing, and is consumed as a unit so its '}'
      // can never be taken as the close of some earlier '{'.
      if (source[i + 1] === "}") { i += 2; continue; }
      i++; continue;
    }
    if (/[12346789]/.test(c)) {
      const [dx, dy] = DIRS[c];
      const nx = ctx.x + dx * ctx.grid;
      const ny = ctx.y + dy * ctx.grid;
      drawLine(ctx, ctx.x, ctx.y, nx, ny);
      ctx.x = nx; ctx.y = ny;
      i++; continue;
    }
    if (c === "@") {
      const ni = handleAt(ctx, source, i, false);
      if (ni >= 0) { i = ni; continue; }
      i++; continue;
    }
    if (LAYERS.has(c)) {
      const rest = source.slice(i);
      let mm;
      if (mm = /^([PpQqRrSsBTOo])=([.0-9]+)/.exec(rest)) {
        ctx.layer = mm[1] === "O" ? "B" : mm[1]; ctx.width = parseFloat(mm[2]);
        i += mm[0].length; continue;
      }
      if (c === "o") { ctx.layer = "o"; i++; continue; }
      if (mm = /^([PpQqRrSsBTO])@([.0-9]+)/.exec(rest)) {
        const layer = mm[1] === "O" ? "B" : mm[1], dia = parseFloat(mm[2]);
        ctx.layer = layer; ctx.width = dia;
        drawCircle(ctx, ctx.x, ctx.y, dia / 2, layer);
        i += mm[0].length; continue;
      }
      if (mm = /^([PpQqRrSsBTO])((?:[-+][.0-9]+){4})/.exec(rest)) {
        const layer = mm[1] === "O" ? "B" : mm[1];
        const nums = mm[2].match(/[-+][.0-9]+/g).map(parseFloat);
        ctx.layer = layer;
        drawRect(ctx, ctx.x + nums[0], ctx.y + nums[1], ctx.x + nums[2], ctx.y + nums[3], layer);
        i += mm[0].length; continue;
      }
      if (mm = /^([PpQqRrSsBTO])([236])/.exec(rest)) {
        ctx.layer = mm[1] === "O" ? "B" : mm[1]; ctx.width = WIDTHS[mm[2]];
        i += mm[0].length; continue;
      }
      i++; continue;
    }
    if (c === ">" || c === "<") {
      let j = i;
      while (j < n && source[j] === c) j++;
      const count = j - i;
      // definition: > + '='
      if (c === ">" && j < n && source[j] === "=") {
        // >=>spec{body} defines the component and places it straight away:
        // >=>name{...}          is  >=name{...} >name{}
        // >=>>label=name@pin{...} is >=name{...} >>label=name@pin{}
        const place = /^(>+|<+)(?:([A-Za-z_][A-Za-z0-9_]*)=)?([A-Za-z_][A-Za-z0-9_]*)(?:@([A-Za-z0-9_]+))?\s*\{/.exec(source.slice(j + 1));
        const nm = place || /^([A-Za-z_][A-Za-z0-9_]*)\s*\{/.exec(source.slice(j + 1));
        if (!nm) { i = j + 1; continue; }
        const compName = place ? place[3] : nm[1];
        const braceStart = j + 1 + nm[0].length - 1;
        const braceEnd = findMatchingBrace(source, braceStart);
        const body = source.slice(braceStart + 1, braceEnd);
        // env captures the component namespace visible at definition time,
        // so the body is early-bound and nested definitions stay private.
        const def = { name: compName, body, defaultPin: { x: 0, y: 0 }, pins: {},
                      env: { ...(ctx.env || ctx.components) } };
        // dry-pass to record pins
        const sub = {
          ...ctx,
          x: 0, y: 0, layer: "p", width: 0.3, grid: INITIAL_GRID,
          stack: [], pinScopes: [], currentDef: def,
          emit: false, transform: null, env: def.env,
        };
        runSource(sub, body);
        (ctx.env || ctx.components)[compName] = def;
        // Place it only once the definition is registered, so the call
        // resolves exactly as a separate >name{} would.
        if (place) executeCall(ctx, place[1][0], place[1].length, place[2], compName, place[4], "");
        i = braceEnd + 1; continue;
      }
      // text: a '{' with no name before it, e.g. >{abc} or <{abc}
      let jt = j;
      while (jt < n && /\s/.test(source[jt])) jt++;
      if (source[jt] === "{") {
        // Read to the first '}': text is literal, so no comment or nesting
        // handling applies inside it (a '}' cannot appear in the text).
        const close = source.indexOf("}", jt + 1);
        const end = close < 0 ? source.length : close;
        drawText(ctx, source.slice(jt + 1, end), c === "<", ((count - 1) * 90) % 360);
        i = close < 0 ? source.length : close + 1; continue;
      }
      // call: (label=)? name (@pin)? {
      const cm = /^(?:([A-Za-z_][A-Za-z0-9_]*)=)?([A-Za-z_][A-Za-z0-9_]*)(?:@([A-Za-z0-9_]+))?\s*(\{)?/.exec(source.slice(j));
      const [full, label, compName, pinName, brace] = cm;
      if (!compName) { i++; continue; }
      // The call block is optional: >name means the same as >name{}.
      if (!brace) {
        executeCall(ctx, c, count, label, compName, pinName, "");
        i = j + full.length; continue;
      }
      const braceStart = j + cm[0].length - 1;
      const braceEnd = findMatchingBrace(source, braceStart);
      const callBody = source.slice(braceStart + 1, braceEnd);
      executeCall(ctx, c, count, label, compName, pinName, callBody);
      i = braceEnd + 1; continue;
    }
    i++;
  }
}

function executeCall(ctx, kind, count, label, compName, pinName, callBody) {
  // Resolve in the definition-time namespace first, then fall back to the
  // global map so forward references keep working.
  const def = (ctx.env && ctx.env[compName]) || ctx.components[compName];
  if (!def) { addError(ctx, "unknown component: " + compName); return; }
  const depth = (ctx.depth || 0) + 1;
  if (depth > MAX_CALL_DEPTH) {
    addError(ctx, "component nesting too deep (>" + MAX_CALL_DEPTH + "): " + compName);
    return;
  }
  const flip = (kind === "<");
  const angle = ((count - 1) * 90) % 360;
  const anchorLocal = (pinName && def.pins[pinName]) ? def.pins[pinName] : def.defaultPin;
  const t0 = { flip, angle, offsetX: 0, offsetY: 0 };
  const ar = applyRotFlip(t0, anchorLocal.x, anchorLocal.y);
  // Local transform maps component-local coords into the caller's frame;
  // the world transform composes that with the caller's own frame.
  const localTransform = { flip, angle, offsetX: ctx.x - ar.x, offsetY: ctx.y - ar.y };
  const transform = composeTransform(ctx.transform, localTransform);

  // Render component body (in its own coordinate frame, drawing enabled iff caller is emitting).
  const sub = {
    ...ctx,
    x: 0, y: 0, layer: "p", width: 0.3, grid: INITIAL_GRID,
    // currentDef stays set so @=pin in the body is a harmless re-registration
    // (same local coords as the dry pass) instead of an error.
    stack: [], pinScopes: [], currentDef: def,
    emit: ctx.emit, transform, env: def.env, depth,
  };
  runSource(sub, def.body);

  if (label) {
    ctx.labeledCalls[label] = { compName, transform, pins: def.pins };
  }

  // Execute the call block with called component's pin scope active.
  // The scope keeps the local transform: ctx.x/ctx.y are caller-local.
  // The call block behaves as if wrapped in (...): position, layer, width and
  // grid are restored afterwards, so a block cannot leak state into what
  // follows. Globals are untouched by this — ctx.vars and ctx.labeledCalls
  // are shared objects, so +a variables and labels set inside the block
  // still propagate outwards.
  const saved = { x: ctx.x, y: ctx.y, layer: ctx.layer, width: ctx.width, grid: ctx.grid };
  const savedStack = ctx.stack.length;
  ctx.pinScopes.push({ pins: def.pins, transform: localTransform });
  runSource(ctx, callBody);
  ctx.pinScopes.pop();
  // An unbalanced '(' inside the block would otherwise leak onto the stack.
  ctx.stack.length = savedStack;
  ctx.x = saved.x; ctx.y = saved.y;
  ctx.layer = saved.layer; ctx.width = saved.width; ctx.grid = saved.grid;
}

/* ---------- Canvas rasterization ---------- */

function computeExtent(bbox) {
  let { minX, minY, maxX, maxY } = bbox;
  if (!isFinite(minX)) { minX = 0; minY = 0; maxX = 0; maxY = 0; }
  const margin = 2;
  minX -= margin; minY -= margin; maxX += margin; maxY += margin;
  let w = maxX - minX, h = maxY - minY;
  if (w < 20) { const d = (20 - w) / 2; minX -= d; maxX += d; w = 20; }
  if (h < 20) { const d = (20 - h) / 2; minY -= d; maxY += d; h = 20; }
  return { minX, minY, maxX, maxY, w, h };
}

function rasterizeMask(primitives, layerSet, ext, pxPerMm, flipX) {
  const W = Math.max(1, Math.round(ext.w * pxPerMm));
  const H = Math.max(1, Math.round(ext.h * pxPerMm));
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#000";
  g.fillRect(0, 0, W, H);
  g.save();
  if (flipX) { g.translate(W, 0); g.scale(-1, 1); }
  g.translate(-ext.minX * pxPerMm, ext.maxY * pxPerMm);
  g.scale(pxPerMm, -pxPerMm);
  g.strokeStyle = "#fff"; g.fillStyle = "#fff";
  for (const p of primitives) {
    if (!layerSet.has(p.layer)) continue;
    if (p.type === "line") {
      g.lineWidth = p.width; g.lineCap = "round";
      g.beginPath(); g.moveTo(p.x1, p.y1); g.lineTo(p.x2, p.y2); g.stroke();
    } else if (p.type === "circle") {
      g.beginPath(); g.arc(p.cx, p.cy, p.r, 0, Math.PI * 2); g.fill();
    } else if (p.type === "rect") {
      g.fillRect(p.x, p.y, p.w, p.h);
    }
  }
  g.restore();
  return { data: g.getImageData(0, 0, W, H).data, W, H };
}

function svgAppendPrim(g, p, color) {
  if (p.type === "line") {
    const el = document.createElementNS(SVG_NS, "line");
    el.setAttribute("x1", p.x1); el.setAttribute("y1", -p.y1);
    el.setAttribute("x2", p.x2); el.setAttribute("y2", -p.y2);
    el.setAttribute("stroke", color);
    el.setAttribute("stroke-width", p.width);
    el.setAttribute("stroke-linecap", "round");
    el.setAttribute("fill", "none");
    g.appendChild(el);
  } else if (p.type === "circle") {
    const el = document.createElementNS(SVG_NS, "circle");
    el.setAttribute("cx", p.cx); el.setAttribute("cy", -p.cy);
    el.setAttribute("r", p.r);
    el.setAttribute("fill", color);
    g.appendChild(el);
  } else if (p.type === "rect") {
    const el = document.createElementNS(SVG_NS, "rect");
    el.setAttribute("x", p.x); el.setAttribute("y", -(p.y + p.h));
    el.setAttribute("width", p.w); el.setAttribute("height", p.h);
    el.setAttribute("fill", color);
    g.appendChild(el);
  }
}
function svgLayerGroup(prims, layerSet, color) {
  const g = document.createElementNS(SVG_NS, "g");
  for (const p of prims) {
    if (!layerSet.has(p.layer)) continue;
    svgAppendPrim(g, p, color);
  }
  return g;
}
function renderSvg(ctx, mode) {
  const ext = computeExtent(ctx.bbox);
  const pxPerMm = 16;
  const W = Math.max(1, Math.round(ext.w * pxPerMm));
  const H = Math.max(1, Math.round(ext.h * pxPerMm));
  const prims = ctx.primitives;
  const flipX = (mode === "bottom");
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("xmlns", SVG_NS);
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.setAttribute("viewBox", ext.minX + " " + (-ext.maxY) + " " + ext.w + " " + ext.h);
  svg.setAttribute("shape-rendering", "geometricPrecision");
  if (flipX) svg.style.transform = "scaleX(-1)";
  function bgRect(color) {
    const r = document.createElementNS(SVG_NS, "rect");
    r.setAttribute("x", ext.minX); r.setAttribute("y", -ext.maxY);
    r.setAttribute("width", ext.w); r.setAttribute("height", ext.h);
    r.setAttribute("fill", color);
    return r;
  }
  if (mode === "pattern") {
    svg.appendChild(bgRect("#fff"));
    const groups = [
      [new Set(["S","s"]), "#ff0"],
      [new Set(["P"]),     "#f0f"],
      [new Set(["p"]),     "#0ff"],
    ];
    for (const [layers, color] of groups) {
      const g = svgLayerGroup(prims, layers, color);
      g.style.mixBlendMode = "multiply";
      svg.appendChild(g);
    }
    svg.appendChild(svgLayerGroup(prims, new Set(["B","T"]), "#000"));
  } else {
    const P = (mode === "bottom") ? "p" : "P";
    const R = (mode === "bottom") ? "r" : "R";
    const S = (mode === "bottom") ? "s" : "S";
    svg.appendChild(bgRect("#ff0"));
    svg.appendChild(svgLayerGroup(prims, new Set([R]), "#fff"));
    svg.appendChild(svgLayerGroup(prims, new Set([S]), "#f0f"));
    const maskId = "pmask-" + Math.floor(Math.random() * 1e9).toString(36);
    const defs = document.createElementNS(SVG_NS, "defs");
    const mask = document.createElementNS(SVG_NS, "mask");
    mask.setAttribute("id", maskId);
    mask.setAttribute("maskUnits", "userSpaceOnUse");
    mask.setAttribute("x", ext.minX);
    mask.setAttribute("y", -ext.maxY);
    mask.setAttribute("width", ext.w);
    mask.setAttribute("height", ext.h);
    const mbg = document.createElementNS(SVG_NS, "rect");
    mbg.setAttribute("x", ext.minX); mbg.setAttribute("y", -ext.maxY);
    mbg.setAttribute("width", ext.w); mbg.setAttribute("height", ext.h);
    mbg.setAttribute("fill", "#000");
    mask.appendChild(mbg);
    mask.appendChild(svgLayerGroup(prims, new Set([P]), "#fff"));
    defs.appendChild(mask);
    svg.appendChild(defs);
    const masked = document.createElementNS(SVG_NS, "g");
    masked.setAttribute("mask", "url(#" + maskId + ")");
    masked.appendChild(bgRect("#0f0"));
    masked.appendChild(svgLayerGroup(prims, new Set([R]), "#0ff"));
    masked.appendChild(svgLayerGroup(prims, new Set([S]), "#00f"));
    svg.appendChild(masked);
    svg.appendChild(svgLayerGroup(prims, new Set(["B","T"]), "#000"));
  }
  return svg;
}

function renderCanvas(ctx, mode) {
  const ext = computeExtent(ctx.bbox);
  const pxPerMm = 16;
  const flipX = (mode === "bottom");

  let dP, dR, dS, dBT, dp, ds;
  const prims = ctx.primitives;
  if (mode === "top") {
    dP  = rasterizeMask(prims, new Set(["P"]),     ext, pxPerMm, flipX);
    dR  = rasterizeMask(prims, new Set(["R"]),     ext, pxPerMm, flipX);
    dS  = rasterizeMask(prims, new Set(["S"]),     ext, pxPerMm, flipX);
    dBT = rasterizeMask(prims, new Set(["B","T"]), ext, pxPerMm, flipX);
  } else if (mode === "bottom") {
    dP  = rasterizeMask(prims, new Set(["p"]),     ext, pxPerMm, flipX);
    dR  = rasterizeMask(prims, new Set(["r"]),     ext, pxPerMm, flipX);
    dS  = rasterizeMask(prims, new Set(["s"]),     ext, pxPerMm, flipX);
    dBT = rasterizeMask(prims, new Set(["B","T"]), ext, pxPerMm, flipX);
  } else {
    dP  = rasterizeMask(prims, new Set(["P"]),     ext, pxPerMm, false);
    dp  = rasterizeMask(prims, new Set(["p"]),     ext, pxPerMm, false);
    ds  = rasterizeMask(prims, new Set(["S","s"]), ext, pxPerMm, false);
    dBT = rasterizeMask(prims, new Set(["B","T"]), ext, pxPerMm, false);
  }

  const W = dBT.W, H = dBT.H;
  const out = document.createElement("canvas");
  out.width = W; out.height = H;
  const octx = out.getContext("2d");
  const img = octx.createImageData(W, H);
  const od = img.data;
  const total = W * H;

  if (mode === "pattern") {
    const aP = dP.data, ap = dp.data, aS = ds.data, aBT = dBT.data;
    for (let i = 0; i < total; i++) {
      const k = i * 4;
      let r = 0xff, g = 0xff, b = 0xff;
      if (aS[k]  > 128) b = 0;             // silk → AND #ff0 (yellow)
      if (aP[k]  > 128) g = 0;             // P    → AND #f0f (magenta)
      if (ap[k]  > 128) r = 0;             // p    → AND #0ff (cyan)
      if (aBT[k] > 128) { r = 0; g = 0; b = 0; }
      od[k] = r; od[k+1] = g; od[k+2] = b; od[k+3] = 0xff;
    }
  } else {
    const aP = dP.data, aR = dR.data, aS = dS.data, aBT = dBT.data;
    for (let i = 0; i < total; i++) {
      const k = i * 4;
      let r = 0xff, g = 0xff, b = 0xff;
      const hasS = aS[k] > 128, hasR = aR[k] > 128, hasP = aP[k] > 128, hasBT = aBT[k] > 128;
      if (hasS)       g = 0;               // AND #f0f
      else if (!hasR) b = 0;               // AND #ff0
      if (hasP)       r = 0;               // AND #0ff
      if (hasBT)      { r = 0; g = 0; b = 0; }
      od[k] = r; od[k+1] = g; od[k+2] = b; od[k+3] = 0xff;
    }
  }
  octx.putImageData(img, 0, 0);
  return out;
}

function sanitizeProjectName(name) {
  const s = String(name || "board").replace(/[^A-Za-z0-9._\-]/g, "_").replace(/^_+|_+$/g, "");
  return s || "board";
}
function timestampStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
}
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- PDF export via browser print ---------- */
function renderSvgAtMm(ctx, mode) {
  const svg = renderSvg(ctx, mode);
  const ext = computeExtent(ctx.bbox);
  svg.setAttribute("width", ext.w + "mm");
  svg.setAttribute("height", ext.h + "mm");
  svg.removeAttribute("style");
  if (mode === "bottom") svg.setAttribute("style", "transform:scaleX(-1)");
  return svg;
}
function exportPdf(ctx, projectName) {
  const ext = computeExtent(ctx.bbox);
  const bw = ext.w, bh = ext.h;
  const PAPERS = [
    { n: "A4P", w: 210, h: 297 },
    { n: "A4L", w: 297, h: 210 },
    { n: "A3P", w: 297, h: 420 },
    { n: "A3L", w: 420, h: 297 },
  ];
  const pageMargin = 8;
  let paper = null;
  for (const q of PAPERS) {
    if (bw + 2 * pageMargin <= q.w && bh + 2 * pageMargin <= q.h) { paper = q; break; }
  }
  if (!paper) { alert("基板が A3 に入りません (" + bw.toFixed(1) + " × " + bh.toFixed(1) + " mm)"); return; }
  const modeNames = { top: "部品面", bottom: "半田面", pattern: "パターン (透過)" };
  const modes = ["top", "bottom", "pattern"];
  const title = sanitizeProjectName(projectName) + "_" + timestampStr();
  const w = window.open("", "_blank");
  if (!w) { alert("ポップアップがブロックされました。ブラウザの設定でこのサイトを許可してください。"); return; }
  const doc = w.document;
  const style = "@page { size: " + paper.w + "mm " + paper.h + "mm; margin: 0; }" +
    " html, body { margin: 0; padding: 0; }" +
    " .page { width: " + paper.w + "mm; height: " + paper.h + "mm; page-break-after: always; position: relative; box-sizing: border-box; overflow: hidden; }" +
    " .page:last-child { page-break-after: auto; }" +
    " .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }" +
    " .label { position: absolute; left: 8mm; top: 8mm; font-family: sans-serif; font-size: 9pt; color: #333; }" +
    " svg { display: block; }";
  doc.open();
  doc.write("<!doctype html><html><head><meta charset=\"utf-8\"><title>" + title + "</title><style>" + style + "</style></head><body>" +
    modes.map(m => "<div class=\"page\"><div class=\"label\">" + title + " — " + modeNames[m] + " (" + paper.n + ", " + bw.toFixed(2) + "×" + bh.toFixed(2) + " mm)</div><div class=\"center\" id=\"c-" + m + "\"></div></div>").join("") +
    "</body></html>");
  doc.close();
  for (const m of modes) {
    const svg = renderSvgAtMm(ctx, m);
    doc.getElementById("c-" + m).appendChild(svg);
  }
  setTimeout(() => { w.focus(); w.print(); }, 200);
}

/* ---------- Gerber + ZIP export ---------- */
const CRC32_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {

function buildZip(entries) {

    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, dosTime, true);
    lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);
    lv.setUint32(22, size, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);

    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);

function fmtGerberCoord(mm) {
  const v = Math.round(mm * 100000);
  return (v < 0 ? "-" : "") + Math.abs(v).toString();
}
function fmtNum5(n) {
  return (Math.round(n * 100000) / 100000).toString();
}
function buildGerberFile(prims, layerSet, title) {
  const lines = [];
  lines.push("G04 " + title + " *");
  lines.push("%FSLAX45Y45*%");
  lines.push("%MOMM*%");
  lines.push("%LPD*%");
  lines.push("G01*");
  const apertures = new Map();
  const defs = [];
  let nextDcode = 10;
  function apKey(p) {
    if (p.type === "line") return "C:" + fmtNum5(p.width);
    if (p.type === "circle") return "C:" + fmtNum5(2 * p.r);
    if (p.type === "rect") return "R:" + fmtNum5(p.w) + "x" + fmtNum5(p.h);
    return null;
  }
  function apDef(p) {
    if (p.type === "line") return "C," + fmtNum5(p.width);
    if (p.type === "circle") return "C," + fmtNum5(2 * p.r);
    if (p.type === "rect") return "R," + fmtNum5(p.w) + "X" + fmtNum5(p.h);
    return null;
  }
  const usable = [];
  for (const p of prims) {
    if (!layerSet.has(p.layer)) continue;
    const key = apKey(p);
    if (!key) continue;
    if (!apertures.has(key)) {
      const dcode = nextDcode++;
      apertures.set(key, dcode);
      defs.push("%ADD" + dcode + apDef(p) + "*%");
    }
    usable.push({ p, dcode: apertures.get(key) });
  }
  for (const d of defs) lines.push(d);
  let curDcode = null;
  for (const { p, dcode } of usable) {
    if (dcode !== curDcode) { lines.push("D" + dcode + "*"); curDcode = dcode; }
    if (p.type === "line") {
      lines.push("X" + fmtGerberCoord(p.x1) + "Y" + fmtGerberCoord(p.y1) + "D02*");
      lines.push("X" + fmtGerberCoord(p.x2) + "Y" + fmtGerberCoord(p.y2) + "D01*");
    } else if (p.type === "circle") {
      lines.push("X" + fmtGerberCoord(p.cx) + "Y" + fmtGerberCoord(p.cy) + "D03*");
    } else if (p.type === "rect") {
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h / 2;
      lines.push("X" + fmtGerberCoord(cx) + "Y" + fmtGerberCoord(cy) + "D03*");
    }
  }
  lines.push("M02*");
  return lines.join("\n") + "\n";
}
function exportGerber(ctx, projectName) {
  const name = sanitizeProjectName(projectName);
  const prims = ctx.primitives;
  const spec = [
    { ext: "GTL", layer: "P", title: "Top Copper" },
    { ext: "GBL", layer: "p", title: "Bottom Copper" },
    { ext: "GTS", layer: "R", title: "Top Solder Mask" },
    { ext: "GBS", layer: "r", title: "Bottom Solder Mask" },
    { ext: "GTO", layer: "S", title: "Top Silk" },
    { ext: "GBO", layer: "s", title: "Bottom Silk" },
    { ext: "GKO", layer: "B", title: "Board Outline" },
    { ext: "DRL.GBR", layer: "T", title: "Drill" },
  ];
  const enc = new TextEncoder();
  const entries = spec.map(s => ({
    name: name + "." + s.ext,
    data: enc.encode(buildGerberFile(prims, new Set([s.layer]), name + " " + s.title)),
  }));
  const zip = buildZip(entries);
  const blob = new Blob([zip], { type: "application/zip" });
  triggerDownload(blob, name + "_" + timestampStr() + ".zip");
}

function interpret(source) {
  const ctx = makeCtx();
  try { runSource(ctx, source); }
  catch (e) { ctx.errors.push(String(e && e.message || e)); }
  return ctx;
}

/* ---------- Storage (mirrors pcbgrid20-preview.html) ---------- */

const STORAGE_KEY = "pcb10-preview.files.v1";

const DEFAULT_CONTENT = `# pcb10 sample — 2-layer PCB draft.
# Layers: P/p top/bot pattern, Q/q pattern+resist, R/r resist,
#         S/s silk, B outline, T hole. Digits 2/3/6 = width mm.

# --- Outline (green): 30 x 20 mm rectangle, corners (0,0)-(30,20)
B3
+30+0 +0+20 -30+0 +0-20

# --- Component definitions -------------------------------------------
# through-hole pad (0.8mm hole, 1.4mm land on both faces)
>=th{
  Q@1.4q@1.4T@0.8
}
# SMD land (2mm x 1mm, top pattern + resist opening)
>=smd{
  Q-1-0.5+1+0.5
}

# --- Placement --------------------------------------------------------
# Two through-holes, 7.5mm apart, near the left edge
!+5+5
+a >th{}
!+7.5+0 >th{}

# Row of 4 SMD pads on 2.54mm pitch, middle of the board
!+5+8
>smd{}
!+2.54+0 >smd{}
!+2.54+0 >smd{}
!+2.54+0 >smd{}

# Silk trace: from the first through-hole, go 5mm right
S3
!-aa
+5+0
`;

function loadAll() {
  try {
    const j = localStorage.getItem(STORAGE_KEY);
    return j ? (JSON.parse(j) || {}) : {};
  } catch (e) { return {}; }
}
function saveAll(all) { localStorage.setItem(STORAGE_KEY, JSON.stringify(all)); }
function loadFile(id) { return loadAll()[id] || null; }
function saveFile(id, patch) {
  const all = loadAll();
  const cur = all[id] || { id, title: "", content: "", createdAt: Date.now() };
  all[id] = Object.assign(cur, patch, { updatedAt: Date.now() });
  saveAll(all);
  return all[id];
}
function deleteFile(id) { const all = loadAll(); delete all[id]; saveAll(all); }
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function createFile() {
  const id = newId();
  const all = loadAll();
  const n = Object.keys(all).length + 1;
  const f = { id, title: `pcb10 ${n}`, content: DEFAULT_CONTENT, createdAt: Date.now(), updatedAt: Date.now() };
  all[id] = f; saveAll(all);
  return f;
}

/* ---------- routing ---------- */

function currentRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("f/")) return { name: "file", id: h.slice(2) };
  return { name: "index" };
}
function go(hash) { location.hash = hash; }
window.addEventListener("hashchange", route);
document.addEventListener("DOMContentLoaded", route);

function route() {
  const r = currentRoute();
  if (r.name === "file") {
    const f = loadFile(r.id);
    if (!f) { go(""); return; }
    renderEditor(f);
  } else renderIndex();
}

function escXml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;" }[c]));
}
function fmtDate(t) {
  if (!t) return "";
  const d = new Date(t), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderIndex() {
  const all = loadAll();
  const files = Object.values(all).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const app = document.getElementById("app");
  app.innerHTML = `
    <div id="index">
      <h1>pcb10 preview</h1>
      <p><button class="new" id="new-btn">+ 新しい pcb10</button></p>
      ${files.length === 0
        ? `<p class="empty">まだファイルがありません。上のボタンで作成してください。</p>`
        : `<ul>${files.map(f => `
            <li>
              <a data-id="${f.id}">${escXml(f.title || "(無題)")}</a>
              <span class="meta">${fmtDate(f.updatedAt)}</span>
              <button data-del="${f.id}">削除</button>
            </li>`).join("")}</ul>`}
    </div>`;
  document.getElementById("new-btn").addEventListener("click", () => {
    const f = createFile(); go(`f/${f.id}`);
  });
  app.querySelectorAll("a[data-id]").forEach(a =>
    a.addEventListener("click", () => go(`f/${a.dataset.id}`)));
  app.querySelectorAll("button[data-del]").forEach(b =>
    b.addEventListener("click", () => {
      if (confirm("このファイルを削除しますか?")) { deleteFile(b.dataset.del); renderIndex(); }
    }));
}

function renderEditor(f) {
  const app = document.getElementById("app");
  app.innerHTML = `
    <header>
      <a id="back-link">← 一覧</a>
      <input class="title" id="title" value="${escXml(f.title)}">
      <span class="spacer"></span>
      <button id="pdf-btn">PDF</button>
      <button id="gerber-btn">Gerber</button>
      <span id="status" style="color:#888;font-size:12px">保存済み</span>
    </header>
    <main>
      <div class="pane-label">
        <span>preview</span>
        <span id="info"></span>
        <span id="modes">
          <button data-mode="top">部品面</button>
          <button data-mode="bottom">半田面</button>
          <button data-mode="pattern">パターン</button>
        </span>
        <span id="renderers">
          <button data-renderer="canvas">Canvas</button>
          <button data-renderer="svg">SVG</button>
        </span>
        <span class="err" id="errors"></span>
      </div>
      <div id="preview"></div>
      <div class="pane-label">input</div>
      <textarea id="src" spellcheck="false"></textarea>
    </main>`;
  const titleEl = document.getElementById("title");
  const srcEl = document.getElementById("src");
  const previewEl = document.getElementById("preview");
  const statusEl = document.getElementById("status");
  const infoEl = document.getElementById("info");
  const errEl = document.getElementById("errors");
  srcEl.value = f.content;

  let mode = renderEditor._mode || "top";
  renderEditor._renderer = renderEditor._renderer || localStorage.getItem("pcb10-preview.renderer") || "canvas";

  let lastCtx = null;
  function update() {
    const ctx = interpret(srcEl.value);
    lastCtx = ctx;
    const view = (renderEditor._renderer === "svg" ? renderSvg : renderCanvas)(ctx, mode);
    previewEl.innerHTML = "";
    previewEl.appendChild(view);
    if (isFinite(ctx.bbox.minX)) {
      const w = (ctx.bbox.maxX - ctx.bbox.minX).toFixed(2);
      const h = (ctx.bbox.maxY - ctx.bbox.minY).toFixed(2);
      infoEl.textContent = `content: ${w} × ${h} mm`;
    } else infoEl.textContent = "";
    errEl.textContent = ctx.errors.length ? [...new Set(ctx.errors)].join(" / ") : "";
    document.querySelectorAll("#modes button").forEach(b => {
      b.classList.toggle("active", b.dataset.mode === mode);
    });
  }
  update();

  document.querySelectorAll("#modes button").forEach(b => {
    b.addEventListener("click", () => {
      mode = b.dataset.mode;
      renderEditor._mode = mode;
      update();
    });
  });
  function refreshRendererButtons() {
    document.querySelectorAll("#renderers button").forEach(bb =>
      bb.classList.toggle("active", bb.dataset.renderer === renderEditor._renderer));
  }
  refreshRendererButtons();
  document.querySelectorAll("#renderers button").forEach(b => {
    b.addEventListener("click", () => {
      renderEditor._renderer = b.dataset.renderer;
      localStorage.setItem("pcb10-preview.renderer", renderEditor._renderer);
      refreshRendererButtons();
      update();
    });
  });

  srcEl.addEventListener("input", () => {
    statusEl.textContent = "保存中…";
    saveFile(f.id, { content: srcEl.value });
    update();
    statusEl.textContent = "保存済み";
  });
  titleEl.addEventListener("input", () => {
    statusEl.textContent = "保存中…";
    saveFile(f.id, { title: titleEl.value });
    statusEl.textContent = "保存済み";
  });
  document.getElementById("pdf-btn").addEventListener("click", () => {
    if (lastCtx) exportPdf(lastCtx, titleEl.value);
  });
  document.getElementById("gerber-btn").addEventListener("click", () => {
    if (lastCtx) exportGerber(lastCtx, titleEl.value);
  });
  document.getElementById("back-link").addEventListener("click", () => go(""));
}
</script>
